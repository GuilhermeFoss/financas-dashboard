<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Finanças</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: #0b0f14; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #e6edf3;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top);
  }
  .page { max-width: 480px; margin: 0 auto; padding: 20px 16px 100px; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .header-titles h1 { font-size: 22px; font-weight: 700; }
  .updated { color: #7d8590; font-size: 11px; margin-top: 2px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; background: #161b22; border: 1px solid #30363d;
    display: flex; align-items: center; justify-content: center; font-size: 16px; color: #7d8590;
    text-decoration: none; flex-shrink: 0; cursor: pointer;
  }
  .header-btns { display: flex; gap: 8px; }
  .alert {
    background: #3d2b0a; border: 1px solid #9e6a03; color: #f0b429;
    padding: 12px 16px; border-radius: 12px; font-size: 13px; margin-bottom: 14px; text-align: center;
  }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 14px; min-width: 0; }
  .card.highlight { grid-column: 1 / -1; background: linear-gradient(135deg, #17352a, #10241d); border-color: #2ea043; padding: 18px; }
  .card-label { font-size: 10.5px; color: #7d8590; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-value { font-size: 26px; font-weight: 700; line-height: 1.15; word-break: break-word; }
  .card.highlight .card-value { font-size: 32px; }
  .card-value.small { font-size: 19px; }
  .section { margin-bottom: 26px; }
  .section h2 { font-size: 13px; margin-bottom: 12px; color: #c9d1d9; font-weight: 600; }
  .cat-row { margin-bottom: 11px; }
  .cat-label { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-bottom: 4px; }
  .cat-label span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-label span:last-child { flex-shrink: 0; color: #c9d1d9; }
  .cat-bar-track { background: #21262d; border-radius: 6px; height: 7px; overflow: hidden; }
  .cat-bar-fill { background: linear-gradient(90deg, #58a6ff, #79c0ff); height: 100%; border-radius: 6px; }
  .saldo-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 11px 0; border-bottom: 1px solid #21262d; font-size: 13.5px; }
  .saldo-row:last-child { border-bottom: none; }
  .saldo-row > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pos { color: #3fb950; font-weight: 600; flex-shrink: 0; }
  .neg { color: #f85149; font-weight: 600; flex-shrink: 0; }
  .muted { color: #7d8590; font-size: 13px; }
  .banco-block { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .banco-header { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; }
  .banco-devido { display: flex; justify-content: space-between; font-size: 12.5px; color: #7d8590; padding: 6px 0 0 10px; }
  .month-nav { display: flex; align-items: center; justify-content: space-between; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 10px 14px; margin-bottom: 18px; font-size: 13px; }
  .month-nav button { background: none; border: none; color: #58a6ff; font-weight: 600; font-size: 13px; padding: 4px 8px; cursor: pointer; font-family: inherit; }
  .month-nav button:disabled { color: #30363d; cursor: default; }
  .month-nav span { color: #c9d1d9; font-weight: 600; text-transform: capitalize; }
  .total-line { font-size: 13px; color: #7d8590; padding-bottom: 8px; margin-bottom: 4px; border-bottom: 1px solid #21262d; }
  .total-line strong { color: #e6edf3; font-size: 15px; }
  .loading { text-align: center; padding: 60px 0; color: #7d8590; }
  .setup { max-width: 420px; margin: 80px auto; padding: 0 20px; text-align: center; }
  .setup h1 { font-size: 20px; margin-bottom: 8px; }
  .setup p { color: #7d8590; font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
  .setup input {
    width: 100%; background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 12px 14px;
    color: #e6edf3; font-size: 13px; margin-bottom: 12px; font-family: inherit;
  }
  .setup button {
    width: 100%; background: #2ea043; border: none; border-radius: 10px; padding: 12px 14px;
    color: white; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .setup .error { color: #f85149; font-size: 12px; margin-top: 10px; }

  .tx-row { padding: 10px 0; border-bottom: 1px solid #21262d; }
  .tx-row:last-child { border-bottom: none; }
  .tx-line1 { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
  .tx-line1 .tx-item { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx-line1 .tx-valor { flex-shrink: 0; font-weight: 600; }
  .tx-line2 { margin-top: 2px; font-size: 12px; }
  .tx-pending { color: #f0b429; }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    display: flex; justify-content: space-around;
    background: #161b22; border-top: 1px solid #30363d;
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
  }
  .bottom-nav button {
    background: none; border: none; color: #7d8590; font-family: inherit; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 4px 18px; font-size: 10.5px;
  }
  .bottom-nav button .icon { font-size: 19px; }
  .bottom-nav button.active { color: #58a6ff; }

  .chart-wrap { position: relative; }
  .chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart-tooltip {
    position: absolute; transform: translate(-50%, -100%); pointer-events: none;
    background: #21262d; border: 1px solid #30363d; border-radius: 8px; padding: 6px 10px;
    font-size: 12px; line-height: 1.6; white-space: nowrap; opacity: 0; transition: opacity 0.1s;
  }
  .chart-tooltip.visible { opacity: 1; }
  .chart-tooltip .t-valor { font-weight: 700; color: #e6edf3; }
  .chart-tooltip .t-mes { color: #7d8590; }
  .chart-tooltip .t-key { display: inline-block; width: 10px; border-top: 2px solid; margin-right: 4px; vertical-align: middle; }
  .chart-point { cursor: pointer; }
  .chart-legend { display: flex; gap: 14px; margin-bottom: 10px; font-size: 12px; color: #c9d1d9; }
  .chart-legend span { display: flex; align-items: center; gap: 5px; }
  .chart-legend i { display: inline-block; width: 12px; height: 2px; border-radius: 1px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

  .filter-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
  .filter-toggle button {
    flex: 1; background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 9px;
    color: #7d8590; font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .filter-toggle button.active { color: #58a6ff; border-color: #58a6ff; }

  @media (max-width: 360px) {
    .card.highlight .card-value { font-size: 28px; }
    .card-value { font-size: 22px; }
  }
</style>
</head>
<body>
  <div id="app"></div>

<script>
const STORAGE_KEY = 'financas_dashboard_url';
let monthOffset = 0;
let activeTab = 'resumo'; // 'resumo' | 'transacoes' | 'pessoas' | 'evolucao'
let evolucaoPeriodo = 'h1'; // 'h1' | 'h2' | 'ano' — período fixo do ano corrente, aba Evolução

function formatBRL(n) {
  n = Number(n) || 0;
  return n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function formatDataCurta(iso) {
  if (!iso) return '';
  const [, m, d] = iso.split('-');
  return `${d}/${m}`;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s === null || s === undefined ? '' : String(s);
  return d.innerHTML;
}

function getSavedUrl() {
  return localStorage.getItem(STORAGE_KEY);
}

function renderSetup(errorMsg) {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="setup">
      <h1>💰 Configurar Finanças</h1>
      <p>Cole a URL completa do dashboard — a mesma que você usa no widget/atalho (com <code>?token=...</code>).</p>
      <input id="url-input" type="text" placeholder="https://financas-worker..../api/dashboard?token=...">
      <button onclick="saveUrl()">Salvar</button>
      ${errorMsg ? `<p class="error">${esc(errorMsg)}</p>` : ''}
    </div>`;
}

// Valida a URL colada e dá uma mensagem específica pro problema mais comum (token esquecido),
// em vez de deixar o erro genérico e críptico do `new URL()` do navegador aparecer pro usuário
// (no Safari: "The string did not match the expected pattern.").
function validateDashboardUrl(val) {
  if (!val || !val.startsWith('http')) {
    return 'Cole a URL completa, começando com https://';
  }
  let parsed;
  try {
    parsed = new URL(val);
  } catch {
    return 'Essa URL não é válida — confira se copiou ela inteira, sem cortar nada.';
  }
  if (!parsed.searchParams.get('token')) {
    return 'Falta o "?token=..." no final da URL — sem ele o Worker recusa a requisição. Pegue a URL completa (com token) no widget/atalho, ou no .secrets.local do projeto no Mac.';
  }
  return null;
}

function saveUrl() {
  const val = document.getElementById('url-input').value.trim();
  const erro = validateDashboardUrl(val);
  if (erro) {
    renderSetup(erro);
    return;
  }
  localStorage.setItem(STORAGE_KEY, val);
  loadActiveTab();
}

// path opcional: troca só o pathname da URL salva, mantendo origem+token — permite reusar a
// mesma URL configurada (que aponta pra /api/dashboard) pra chamar /api/transacoes também.
function buildFetchUrl(offset, path) {
  const saved = getSavedUrl();
  let u;
  try {
    u = new URL(saved);
  } catch {
    throw new Error('A URL salva ficou inválida. Toque em ⚙️ e configure de novo.');
  }
  if (path) u.pathname = path;
  u.searchParams.set('format', 'json');
  u.searchParams.set('month', offset);
  return u.toString();
}

// /api/evolucao não usa mês nenhum — é sempre um período fixo do ano corrente (1º semestre,
// 2º semestre ou ano inteiro), não uma janela que muda conforme os dias passam.
function buildEvolucaoUrl(periodo) {
  const saved = getSavedUrl();
  let u;
  try {
    u = new URL(saved);
  } catch {
    throw new Error('A URL salva ficou inválida. Toque em ⚙️ e configure de novo.');
  }
  u.pathname = '/api/evolucao';
  u.searchParams.delete('month');
  u.searchParams.set('periodo', periodo);
  return u.toString();
}

async function fetchJson(url) {
  const res = await fetch(url);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function loadActiveTab() {
  const saved = getSavedUrl();
  if (!saved) { renderSetup(); return; }

  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Carregando…</div>';

  try {
    if (activeTab === 'resumo') {
      const data = await fetchJson(buildFetchUrl(monthOffset));
      renderShell(data, renderResumoContent(data));
    } else if (activeTab === 'evolucao') {
      const data = await fetchJson(buildEvolucaoUrl(evolucaoPeriodo));
      renderShell(data, renderEvolucaoContent(data));
    } else {
      const data = await fetchJson(buildFetchUrl(monthOffset, '/api/transacoes'));
      const content = activeTab === 'transacoes' ? renderTransacoesContent(data) : renderPessoasContent(data);
      renderShell(data, content);
    }
  } catch (e) {
    renderFetchError(e.message);
  }
}

// Menu inferior fixo — compartilhado entre a casca normal e a tela de erro (pra dar pro usuário
// como trocar de aba mesmo quando uma delas falhou, o que já ajuda a diagnosticar se é uma aba
// só ou o Worker inteiro fora do ar).
function bottomNavHtml() {
  return `
    <div class="bottom-nav">
      <button class="${activeTab === 'resumo' ? 'active' : ''}" onclick="switchTab('resumo')"><span class="icon">📊</span>Resumo</button>
      <button class="${activeTab === 'transacoes' ? 'active' : ''}" onclick="switchTab('transacoes')"><span class="icon">🧾</span>Transações</button>
      <button class="${activeTab === 'pessoas' ? 'active' : ''}" onclick="switchTab('pessoas')"><span class="icon">🤝</span>Pessoas</button>
      <button class="${activeTab === 'evolucao' ? 'active' : ''}" onclick="switchTab('evolucao')"><span class="icon">📈</span>Evolução</button>
    </div>`;
}

// Erro ao buscar uma aba (rede, timeout, erro do Worker) — mostra inline com um botão de
// "tentar de novo" e mantém o menu inferior. Antes disso caía direto na tela de configurar URL,
// o que "deslogava" o usuário (parecia que o token tinha expirado) mesmo quando a URL salva
// continuava perfeitamente válida — só a tentativa de buscar dados é que falhou.
function renderFetchError(message) {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="page">
      <div class="setup" style="margin-top:70px;">
        <h1>⚠️ Não consegui carregar</h1>
        <p>${esc(message)}</p>
        <button onclick="loadActiveTab()">Tentar de novo</button>
        <p class="error" style="margin-top:14px; cursor:pointer; text-decoration:underline;" onclick="reconfigure()">Reconfigurar URL/token</p>
      </div>
    </div>
    ${bottomNavHtml()}`;
}

// Casca comum a todas as abas: cabeçalho, navegação de mês, conteúdo da aba, menu inferior.
function renderShell(data, contentHtml) {
  const app = document.getElementById('app');
  const ehMesAtual = data.monthOffset === 0;
  // A aba Evolução não é "de um mês" — é sempre uma janela rolante dos últimos N meses, então a
  // navegação ← anterior/seguinte → (que pertence ao conceito de "mês selecionado") não se aplica.
  const showMonthNav = activeTab !== 'evolucao';

  app.innerHTML = `
    <div class="page">
      <div class="header">
        <div class="header-titles">
          <h1>💰 Finanças</h1>
          <p class="updated">Atualizado ${esc(data.atualizado)}</p>
        </div>
        <div class="header-btns">
          <a class="icon-btn" onclick="loadActiveTab()">↻</a>
          <a class="icon-btn" onclick="reconfigure()">⚙️</a>
        </div>
      </div>

      ${showMonthNav ? `<div class="month-nav">
        <button onclick="changeMonth(-1)">← anterior</button>
        <span>${ehMesAtual ? 'mês atual' : esc(data.mesNome)}</span>
        <button onclick="changeMonth(1)">seguinte →</button>
      </div>` : ''}

      ${contentHtml}
    </div>

    ${bottomNavHtml()}`;
}

function renderResumoContent(data) {
  const topCategorias = data.categorias || [];
  const maxCategoria = topCategorias.length ? Math.max(...topCategorias.map(c => c.valor)) : 1;
  const categoriasHtml = topCategorias.map(c => {
    const pct = Math.max(4, Math.round((c.valor / maxCategoria) * 100));
    return `<div class="cat-row"><div class="cat-label"><span>${esc(c.nome)}</span><span>R$ ${formatBRL(c.valor)}</span></div><div class="cat-bar-track"><div class="cat-bar-fill" style="width:${pct}%"></div></div></div>`;
  }).join('') || '<p class="muted">Sem compras neste mês.</p>';

  function pessoasListHtml(lista, positivo) {
    if (!lista || lista.length === 0) return '<p class="muted">Ninguém, por enquanto. 🎉</p>';
    const total = lista.reduce((sum, p) => sum + p.valor, 0);
    const linhas = lista.map(p =>
      `<div class="saldo-row"><span>${esc(p.nome)}</span><span class="${positivo ? 'pos' : 'neg'}">R$ ${formatBRL(p.valor)}</span></div>`
    ).join('');
    return `<div class="total-line">Total: <strong>R$ ${formatBRL(total)}</strong></div>${linhas}`;
  }

  const ehMesAtual = data.monthOffset === 0;
  const saldos = data.saldos || [];
  const saldosHtml = saldos.length === 0
    ? '<p class="muted">Ninguém deve nada no momento. 🎉</p>'
    : saldos.map(p => {
        const positivo = p.saldo > 0;
        return `<div class="saldo-row"><span>${positivo ? '🟢' : '🔴'} ${esc(p.nome)}</span><span class="${positivo ? 'pos' : 'neg'}">${positivo ? 'te deve' : 'você deve'} R$ ${formatBRL(Math.abs(p.saldo))}</span></div>`;
      }).join('');

  const bancos = data.bancos || [];
  const bancosHtml = bancos.length === 0
    ? '<p class="muted">Sem movimentação neste mês.</p>'
    : bancos.map(b => {
        const devidoHtml = (b.devidoPor || []).map(p =>
          `<div class="banco-devido"><span>${esc(p.nome)}</span><span>R$ ${formatBRL(p.valor)}</span></div>`
        ).join('');
        return `<div class="banco-block"><div class="banco-header"><span>${esc(b.banco)}</span><span>R$ ${formatBRL(b.total)}</span></div>${devidoHtml}</div>`;
      }).join('');

  return `
      ${data.pendentes > 0 ? `<div class="alert">⏳ ${data.pendentes} compra${data.pendentes > 1 ? 's' : ''} aguardando revisão</div>` : ''}

      <div class="cards">
        <div class="card highlight">
          <div class="card-label">Total líquido do mês</div>
          <div class="card-value">R$ ${formatBRL(data.totalLiquidoMes)}</div>
        </div>
        <div class="card">
          <div class="card-label">${ehMesAtual && data.gastoOntem !== null ? 'Gasto de ontem' : 'Total bruto do mês'}</div>
          <div class="card-value small">R$ ${formatBRL(ehMesAtual && data.gastoOntem !== null ? data.gastoOntem : data.totalBrutoMes)}</div>
        </div>
      </div>

      <div class="section">
        <h2>🏆 Por categoria — ${esc(data.mesNome)}</h2>
        ${categoriasHtml}
      </div>

      <div class="section">
        <h2>🟢 Quem me deve — ${esc(data.mesNome)}</h2>
        ${pessoasListHtml(data.quemMeDeve, true)}
      </div>

      <div class="section">
        <h2>🔴 Quem eu devo — ${esc(data.mesNome)}</h2>
        ${pessoasListHtml(data.quemEuDevo, false)}
      </div>

      ${ehMesAtual ? `<div class="section">
        <h2>🤝 Saldos com pessoas (total acumulado, todos os meses)</h2>
        ${saldosHtml}
      </div>` : ''}

      <div class="section">
        <h2>💳 Por banco — ${esc(data.mesNome)}</h2>
        ${bancosHtml}
      </div>`;
}

// "Parcela: x/y" nas compras parceladas — só aparece quando parcelaTotal > 1 (compra à vista
// não tem parcela pra mostrar).
function parcelaBadge(tx) {
  return tx.parcelaTotal > 1 ? ` · Parcela: ${tx.parcelaAtual}/${tx.parcelaTotal}` : '';
}

// Lista crua das compras do mês, ordenada por data (a API já manda ordenado). Assinaturas
// (recorrente: true) não têm Data própria — não fazem sentido numa lista "compras do mês por
// data" — essas só aparecem agrupadas na aba Pessoas.
function renderTransacoesContent(data) {
  const txs = (data.transacoes || []).filter(tx => !tx.recorrente);
  if (!txs.length) {
    return `<div class="section"><p class="muted">Nenhuma compra neste mês.</p></div>`;
  }
  const linhas = txs.map(tx => {
    const pendingBadge = tx.status === 'Pending Review' ? ' <span class="tx-pending">⏳</span>' : '';
    return `
      <div class="tx-row">
        <div class="tx-line1">
          <span class="tx-item">${esc(tx.item)}${pendingBadge}</span>
          <span class="tx-valor">R$ ${formatBRL(tx.valorTotal)}</span>
        </div>
        <div class="tx-line2 muted">${formatDataCurta(tx.data)} · ${esc(tx.categoria)} · ${esc(tx.banco)}${parcelaBadge(tx)}</div>
      </div>`;
  }).join('');
  return `<div class="section"><h2>🧾 Compras — ${esc(data.mesNome)}</h2>${linhas}</div>`;
}

// Agrupa as compras do mês por pessoa (Quem Racha) — cada grupo mostra o saldo líquido daquela
// pessoa no mês e a lista das compras que compõem esse saldo.
function renderPessoasContent(data) {
  const txs = data.transacoes || [];
  const porPessoa = {};
  txs.forEach(tx => {
    if (!tx.quemRacha) return;
    porPessoa[tx.quemRacha] ??= { meDeve: 0, euDevo: 0, itens: [] };
    const grupo = porPessoa[tx.quemRacha];
    if (tx.pagoPorMim) {
      const valor = tx.valorTotal - tx.meuValor;
      grupo.meDeve += valor;
      grupo.itens.push({ ...tx, valorRacha: valor, sentido: 'meDeve' });
    } else {
      grupo.euDevo += tx.meuValor;
      grupo.itens.push({ ...tx, valorRacha: tx.meuValor, sentido: 'euDevo' });
    }
  });

  const nomes = Object.keys(porPessoa).sort();
  if (!nomes.length) {
    return `<div class="section"><p class="muted">Nenhuma compra rachada neste mês.</p></div>`;
  }

  return nomes.map(nome => {
    const grupo = porPessoa[nome];
    const saldoLiquido = grupo.meDeve - grupo.euDevo;
    const itensHtml = grupo.itens.map(tx => `
      <div class="saldo-row">
        <span>${esc(tx.item)} <span class="muted">(${tx.recorrente ? 'assinatura fixa' : formatDataCurta(tx.data)}${parcelaBadge(tx)})</span></span>
        <span class="${tx.sentido === 'meDeve' ? 'pos' : 'neg'}">R$ ${formatBRL(tx.valorRacha)}</span>
      </div>`).join('');
    return `
      <div class="section">
        <h2>🤝 ${esc(nome)} — <span class="${saldoLiquido >= 0 ? 'pos' : 'neg'}">${saldoLiquido >= 0 ? 'te deve' : 'você deve'} R$ ${formatBRL(Math.abs(saldoLiquido))}</span></h2>
        ${itensHtml}
      </div>`;
  }).join('');
}

function mesAbrev(mesNome) {
  return (mesNome || '').split(' ')[0].slice(0, 3);
}

// Paleta categórica de referência (skill de dataviz), par validado — hue fixa por gráfico, nunca
// trocada: slot 1 azul = Fixo, slot 2 laranja = Variável.
const COR_FIXO = '#3987e5';
const COR_VARIAVEL = '#d95926';

const PERIODO_LABELS = { h1: '1º semestre', h2: '2º semestre', ano: 'ano inteiro' };

// Dois gráficos de 1 linha cada (SVG puro, sem lib), de um período FIXO do ano corrente —
// 1º semestre (jan-jun), 2º semestre (jul-dez) ou ano inteiro — não uma janela rolante que muda
// de mês pra mês; o mesmo período mostra sempre o mesmo range de calendário, não importa quando
// você olha. Separados porque são naturezas diferentes de gasto, não dois jeitos de ver a mesma
// coisa:
// - Fixo: assinaturas ativas + compras já parceladas (Parcela Total > 1). Cada parcela já existe
//   como linha própria no mês em que cai, então esse gráfico sobe sozinho quando você lança uma
//   compra nova e cai sozinho quando uma parcela termina — sem precisar reconstruir nada.
// - Variável: só compras à vista (sem parcelamento). Em meses futuros do período (ainda não
//   vividos) tende a começar zerado, já que uma compra à vista só existe depois de acontecer.
function renderEvolucaoContent(data) {
  const meses = data.meses || [];
  const periodoLabel = PERIODO_LABELS[evolucaoPeriodo] || PERIODO_LABELS.h1;
  const filtroHtml = `
    <div class="filter-toggle">
      <button class="${evolucaoPeriodo === 'h1' ? 'active' : ''}" onclick="setEvolucaoPeriodo('h1')">1º Semestre</button>
      <button class="${evolucaoPeriodo === 'h2' ? 'active' : ''}" onclick="setEvolucaoPeriodo('h2')">2º Semestre</button>
      <button class="${evolucaoPeriodo === 'ano' ? 'active' : ''}" onclick="setEvolucaoPeriodo('ano')">Ano Inteiro</button>
    </div>`;

  if (meses.length < 2) {
    return `<div class="section">${filtroHtml}<p class="muted">Ainda não há meses suficientes pra montar os gráficos.</p></div>`;
  }

  const n = meses.length;
  const mediaFixo = meses.reduce((s, m) => s + m.fixoTotal, 0) / n;
  const mediaVariavel = meses.reduce((s, m) => s + m.variavel, 0) / n;

  const fixoChart = buildEvolucaoChart(meses, 'fixoTotal', COR_FIXO, 'fixo');
  const variavelChart = buildEvolucaoChart(meses, 'variavel', COR_VARIAVEL, 'variavel');
  window.__evolucaoSeries = { fixo: fixoChart.pontos, variavel: variavelChart.pontos };

  return `
    ${filtroHtml}
    <div class="cards" style="margin-bottom:18px;">
      <div class="card">
        <div class="card-label"><span class="dot" style="background:${COR_FIXO};"></span>Fixo médio/mês</div>
        <div class="card-value small">R$ ${formatBRL(mediaFixo)}</div>
      </div>
      <div class="card">
        <div class="card-label"><span class="dot" style="background:${COR_VARIAVEL};"></span>Variável médio/mês</div>
        <div class="card-value small">R$ ${formatBRL(mediaVariavel)}</div>
      </div>
    </div>

    <div class="section">
      <h2>📌 Fixo — parcelas + assinaturas — ${periodoLabel}</h2>
      ${fixoChart.svgHtml}
      <p class="muted" style="margin-top:8px;">Assinaturas ativas + compras já parceladas. Sobe quando você lança uma compra nova, cai sozinho quando uma parcela termina. Toque num ponto pra ver o valor.</p>
    </div>

    <div class="section">
      <h2>🔀 Variável — compras à vista — ${periodoLabel}</h2>
      ${variavelChart.svgHtml}
      <p class="muted" style="margin-top:8px;">Só compras à vista, sem parcelamento. Meses do período ainda não vividos começam zerados até você lançar algo. Toque num ponto pra ver o valor.</p>
    </div>`;
}

// Monta um gráfico de linha única (path + pontos tocáveis + rótulo no primeiro e no último mês +
// eixo de meses). Devolve o HTML e os pontos em coordenadas de tela, pro tooltip usar depois.
function buildEvolucaoChart(meses, campo, cor, idSuffix) {
  const n = meses.length;
  const maxValor = Math.max(...meses.map(m => m[campo]), 1);
  const W = 320, H = 150, padL = 8, padR = 8, padT = 26, padB = 22;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const xAt = i => padL + (plotW * i) / (n - 1);
  const yAt = v => padT + plotH - (v / (maxValor * 1.15)) * plotH;
  const baseY = (padT + plotH).toFixed(1);

  const pts = meses.map((m, i) => ({ x: xAt(i), y: yAt(m[campo]), valor: m[campo], mesNome: m.mesNome }));
  const linePath = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const dots = pts.map((p, i) => `
    <g class="chart-point" onclick="showEvolucaoTooltip(event, ${i}, '${idSuffix}')">
      <circle cx="${p.x}" cy="${p.y}" r="11" fill="transparent"></circle>
      <circle cx="${p.x}" cy="${p.y}" r="3.5" fill="${cor}" stroke="#0b0f14" stroke-width="2"></circle>
    </g>`).join('');
  const primeiro = pts[0];
  const ultimo = pts[n - 1];
  // Rótulo no primeiro E no último mês do período (não só no último) — o período é fixo agora,
  // então o primeiro ponto pode ser passado, presente ou futuro dependendo de quando você olha;
  // mostrar os dois extremos deixa a tendência do período legível de cara.
  const labelPrimeiro = `<text x="${primeiro.x.toFixed(1)}" y="${Math.max(primeiro.y - 8, 11)}" text-anchor="start" font-size="10.5" font-weight="700" fill="${cor}">R$ ${formatBRL(primeiro.valor)}</text>`;
  const labelUltimo = `<text x="${(ultimo.x + padR).toFixed(1)}" y="${Math.max(ultimo.y - 8, 11)}" text-anchor="end" font-size="10.5" font-weight="700" fill="${cor}">R$ ${formatBRL(ultimo.valor)}</text>`;
  const labelsHtml = meses.map((m, i) =>
    `<text x="${xAt(i)}" y="${H - 6}" text-anchor="middle" font-size="9" fill="#7d8590">${esc(mesAbrev(m.mesNome))}</text>`
  ).join('');

  const svgHtml = `
    <div class="chart-wrap" id="chart-wrap-${idSuffix}">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        <line x1="${padL}" y1="${baseY}" x2="${W - padR}" y2="${baseY}" stroke="#21262d" stroke-width="1"></line>
        <path d="${linePath}" fill="none" stroke="${cor}" stroke-width="2"></path>
        ${labelPrimeiro}
        ${labelUltimo}
        ${dots}
        ${labelsHtml}
      </svg>
      <div class="chart-tooltip" id="chart-tooltip-${idSuffix}"></div>
    </div>`;

  return { svgHtml, pontos: pts };
}

function setEvolucaoPeriodo(periodo) {
  evolucaoPeriodo = periodo;
  loadActiveTab();
}

// Posiciona o tooltip do gráfico tocado (coordenadas do SVG escaladas pro tamanho real renderizado,
// já que o viewBox é fixo mas o SVG estica pra largura da tela). "which" = 'fixo' ou 'variavel',
// cada gráfico tem seu próprio wrap/tooltip/pontos — tocar num não mexe no outro.
function showEvolucaoTooltip(evt, idx, which) {
  evt.stopPropagation();
  const pontos = window.__evolucaoSeries && window.__evolucaoSeries[which];
  const wrap = document.getElementById(`chart-wrap-${which}`);
  const tooltip = document.getElementById(`chart-tooltip-${which}`);
  if (!pontos || !pontos[idx] || !wrap || !tooltip) return;

  const p = pontos[idx];
  const svg = wrap.querySelector('svg');
  const svgRect = svg.getBoundingClientRect();
  const wrapRect = wrap.getBoundingClientRect();
  const scaleX = svgRect.width / 320;
  const scaleY = svgRect.height / 150;

  tooltip.innerHTML = `<span class="t-mes">${esc(p.mesNome)}</span><br><span class="t-valor">R$ ${formatBRL(p.valor)}</span>`;
  tooltip.classList.add('visible');

  const top = (p.y * scaleY) + (svgRect.top - wrapRect.top) - 12;
  let left = (p.x * scaleX) + (svgRect.left - wrapRect.left);
  // Trava horizontalmente pra não vazar do container — o tooltip é centralizado no ponto por
  // padrão (transform: translateX(-50%)), o que estoura a borda quando o ponto é o primeiro/último.
  const half = tooltip.offsetWidth / 2;
  const margem = 4;
  left = Math.min(Math.max(left, half + margem), wrapRect.width - half - margem);

  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';
}

document.addEventListener('click', () => {
  document.querySelectorAll('.chart-tooltip').forEach(t => t.classList.remove('visible'));
});

function switchTab(tab) {
  activeTab = tab;
  loadActiveTab();
}

function changeMonth(delta) {
  monthOffset += delta;
  loadActiveTab();
}

function reconfigure() {
  localStorage.removeItem(STORAGE_KEY);
  renderSetup();
}

loadActiveTab();
</script>
</body>
</html>
